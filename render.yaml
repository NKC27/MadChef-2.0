services:
  - type: web
    name: madchef
    runtime: node
    plan: free
    branch: refactor/vite-typescript-modernization
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SPOONACULAR_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
